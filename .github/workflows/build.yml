name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (${{ matrix.compiler }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64
          - os: ubuntu-24.04
            compiler: gcc
            cc: gcc
          - os: ubuntu-24.04
            compiler: clang
            cc: clang
          - os: ubuntu-22.04
            compiler: gcc
            cc: gcc
          # ARM64
          - os: ubuntu-24.04-arm
            compiler: gcc
            cc: gcc
          - os: ubuntu-24.04-arm
            compiler: clang
            cc: clang

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libdbus-1-dev dbus

      - name: Configure
        run: meson setup build -Dlibdbus=enabled --werror
        env:
          CC: ${{ matrix.cc }}

      - name: Build
        run: meson compile -C build

      - name: Run mock tests
        run: meson test -C build

      # Needs root, and a kernel with MCTP: skipped tests fail the step.
      - name: Run MCTP loopback tests
        if: matrix.os == 'ubuntu-24.04'
        run: sudo ./build/tests/mctp-loopback-tests

      - name: Check installed headers and library
        run: scripts/check-install.sh build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cc == 'clang' && 'clang++' || 'g++' }}

  build-32bit:
    name: Build (gcc, i686)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y meson gcc-multilib libdbus-1-dev:i386 dbus

      - name: Configure
        run: meson setup build --cross-file scripts/cross/i686-multilib.txt -Dlibdbus=enabled --werror

      - name: Build
        run: meson compile -C build

      - name: Run mock tests
        run: meson test -C build

  build-armhf:
    name: Build (gcc, armhf cross + qemu-user, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            configure: -Dlibdbus=disabled
            packages: ""
          - name: dbus-openbmc
            configure: -Dlibdbus=enabled -Dmctpd=openbmc
            packages: libdbus-1-dev:armhf dbus
    steps:
      - uses: actions/checkout@v7

      - name: Enable armhf multiarch
        if: matrix.packages != ''
        run: |
          sudo dpkg --add-architecture armhf
          # The default mirrors only carry amd64; armhf lives on ports.
          sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' \
            /etc/apt/sources.list.d/ubuntu.sources
          # Pin one-line sources to amd64 too, leaving any existing arch= alone.
          sudo sed -i -e 's/^deb \([^[]\)/deb [arch=amd64] \1/' \
            -e '/^deb \[/{/arch=/!s/^deb \[/deb [arch=amd64 /}' \
            /etc/apt/sources.list.d/*.list || true
          sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources > /dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: armhf
          EOF

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson gcc-arm-linux-gnueabihf qemu-user-static ${{ matrix.packages }}

      - name: Configure
        run: >
          meson setup build
          --cross-file scripts/cross/arm-linux-gnueabihf.txt
          --cross-file scripts/cross/qemu-arm.txt
          ${{ matrix.configure }} --werror

      - name: Build
        run: meson compile -C build

      - name: Run mock tests
        run: meson test -C build

  build-options:
    name: Options (${{ matrix.name }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86-64 configurations
          - name: minimal
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=disabled
          - name: dbus-openbmc
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=enabled -Dmctpd=openbmc
          - name: dbus-codeconstruct
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=enabled -Dmctpd=codeconstruct
          - name: cxl2.0-compat
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=enabled -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+dbus-openbmc
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=enabled -Dmctpd=openbmc -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+dbus-codeconstruct
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=enabled -Dmctpd=codeconstruct -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+minimal
            arch: x86-64
            os: ubuntu-24.04
            configure: -Dlibdbus=disabled -Dcxl2_0_mode=enabled
          # ARM64 configurations
          - name: minimal
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=disabled
          - name: dbus-openbmc
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=enabled -Dmctpd=openbmc
          - name: dbus-codeconstruct
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=enabled -Dmctpd=codeconstruct
          - name: cxl2.0-compat
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=enabled -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+dbus-openbmc
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=enabled -Dmctpd=openbmc -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+dbus-codeconstruct
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=enabled -Dmctpd=codeconstruct -Dcxl2_0_mode=enabled
          - name: cxl2.0-compat+minimal
            arch: arm64
            os: ubuntu-24.04-arm
            configure: -Dlibdbus=disabled -Dcxl2_0_mode=enabled

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson libdbus-1-dev dbus

      - name: Configure
        run: meson setup build ${{ matrix.configure }} --werror

      - name: Build
        run: meson compile -C build

      - name: Run mock tests
        run: meson test -C build
